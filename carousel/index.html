<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLUB JOIA 300 · Carousel</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #111111; --muted: #737373; --line: #dbdbdb;
    --dot: #c4c4c4; --dot-on: #0095f6; --ruby: #ef233c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #000000; --text: #f5f5f5; --muted: #a8a8a8; --line: #262626; --dot: #555555; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .post { width: min(470px, 100vw); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  @media (max-width: 500px) { body { padding: 0; place-items: start center; } .post { border-radius: 0; border-left: 0; border-right: 0; } }

  .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, #ef233c, #b5001f, #ef233c); flex: none; }
  .avatar span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #0b0b0d; border: 2px solid var(--card); }
  .avatar img { width: 22px; }
  .who b { display: block; font-weight: 600; }
  .who small { color: var(--muted); font-size: 12px; }

  /* Media: 4:5 portrait like an Instagram post */
  .media { position: relative; aspect-ratio: 4 / 5; background: #0b0b0d; }
  .track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; overflow: hidden; }
  .slide img, .slide video { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
  .slide .missing { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #a8a8a8; font-size: 13px; }
  .slide .missing b { display: block; color: #fff; font-size: 15px; margin-bottom: 6px; }

  .count { position: absolute; top: 12px; right: 12px; background: rgba(18,18,18,.72); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; pointer-events: none; }
  .nav { position: absolute; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: rgba(255,255,255,.85); color: #111; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: opacity .2s; }
  .nav:hover { background: #fff; }
  .nav[hidden] { display: none; }
  .prev { left: 10px; } .next { right: 10px; }
  @media (hover: none) { .nav { display: none; } }

  .sound { position: absolute; right: 12px; bottom: 12px; width: 30px; height: 30px; border-radius: 50%; background: rgba(18,18,18,.72); color: #fff; display: grid; place-items: center; }
  .sound[hidden] { display: none; }
  .paused { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .paused span { width: 72px; height: 72px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; color: #fff; }
  .paused[hidden] { display: none; }
  .heart-pop { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px; color: #fff; filter: drop-shadow(0 4px 16px rgba(0,0,0,.4)); opacity: 0; transform: scale(.4); pointer-events: none; }
  .heart-pop.on { animation: pop .9s ease-out; }
  @keyframes pop { 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(.95); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px 4px; }
  .actions { display: flex; gap: 14px; }
  .actions button svg { display: block; }
  .actions .liked { color: var(--ruby); }
  .dots { display: flex; gap: 4px; justify-content: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); transition: background .2s, transform .2s; }
  .dots i.on { background: var(--dot-on); }
  .save { justify-self: end; }
  .text { padding: 4px 12px 14px; }
  .likes { font-weight: 600; margin-bottom: 4px; }
  .caption b { font-weight: 600; margin-right: 4px; }
  .when { color: var(--muted); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; margin-top: 6px; }
</style>
</head>
<body>
<!--
  CLUB JOIA 300 — Instagram-style carousel
  ────────────────────────────────────────
  To change a slide: put a file named slide_1 … slide_6 in the "footage" folder (any of the types
  below) and remove the old file with the same number. Open this page again — nothing else to edit.
    Video: .mp4 .webm .mov .m4v        Image: .jpg .jpeg .png .webp .gif .avif
  If both a video and an image exist for the same number, the video is used.
  Best size: 1080 × 1350 px (4:5 portrait). Other sizes are cropped to fill the frame.
  The text above and below the post can be changed in SETTINGS at the bottom of this file.
-->
<article class="post" aria-roledescription="carousel" aria-label="CLUB JOIA 300 post">
  <header class="head">
    <div class="avatar"><span><img src="assets/logo.png" alt=""></span></div>
    <div class="who"><b id="account"></b><small id="location"></small></div>
  </header>

  <div class="media">
    <div class="track" id="track" tabindex="0" aria-live="polite"></div>
    <span class="count" id="count"></span>
    <button class="nav prev" id="prev" aria-label="Previous slide" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav next" id="next" aria-label="Next slide">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="sound" id="sound" aria-label="Turn sound on" hidden></button>
    <div class="paused" id="paused" hidden><span><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>
    <svg class="heart-pop" id="heartPop" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.3 2.3 4.5 6 4.5c2.1 0 3.5 1.1 4.3 2.4h1.4C12.5 5.6 13.9 4.5 16 4.5c3.7 0 5.6 3.8 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
  </div>

  <div class="bar">
    <div class="actions">
      <button id="like" aria-label="Like" aria-pressed="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.3 2.3 4.5 6 4.5c2.1 0 3.5 1.1 4.3 2.4h1.4C12.5 5.6 13.9 4.5 16 4.5c3.7 0 5.6 3.8 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
      </button>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="save" id="save" aria-label="Save" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1z"/></svg>
    </button>
  </div>
  <div class="text">
    <p class="likes" id="likes"></p>
    <p class="caption"><b id="captionAccount"></b><span id="caption"></span></p>
    <p class="when" id="when"></p>
  </div>
</article>

<script>
/* ───────────────────────────── SETTINGS ───────────────────────────── */
const SETTINGS = {
  slides: 6,                       // number of slides: footage/slide_1 … slide_N
  folder: "footage",
  account: "clubjoia300",
  location: "Abu Dhabi",
  caption: "Three hundred members. One weekend on the water. Membership by invitation only.",
  likes: 300,
  when: "Sample post",
};
/* ──────────────────────────────────────────────────────────────────── */

// Lower-case first; upper-case variants cover camera files like IMG.JPG / .MOV on case-sensitive web servers.
const withUpper = (list) => [...list, ...list.map((e) => e.toUpperCase())];
const VIDEO_EXT = withUpper(["mp4", "webm", "mov", "m4v"]);
const IMAGE_EXT = withUpper(["jpg", "jpeg", "png", "webp", "gif", "avif"]);
const NAMES = (n) => [`slide_${n}`, `Slide_${n}`];

const $ = (id) => document.getElementById(id);
const track = $("track"), dots = $("dots"), count = $("count");
let current = 0, muted = true, liked = false;
const slides = [];

$("account").textContent = SETTINGS.account;
$("captionAccount").textContent = SETTINGS.account;
$("location").textContent = SETTINGS.location;
$("caption").textContent = SETTINGS.caption;
$("when").textContent = SETTINGS.when;
renderLikes();

// Finds footage/slide_N.<ext> by trying each file type (works when opened straight from disk too).
function probe(url, kind) {
  return new Promise((resolve) => {
    const el = document.createElement(kind);
    const done = (ok) => { el.onload = el.onerror = el.onloadedmetadata = null; resolve(ok ? url : null); };
    el.onerror = () => done(false);
    if (kind === "video") { el.preload = "metadata"; el.muted = true; el.onloadedmetadata = () => done(true); }
    else el.onload = () => done(true);
    el.src = url;
  });
}
async function findFootage(n) {
  // All candidates are checked at once; the first hit in priority order (videos first) wins.
  const candidates = ["video", "img"].flatMap((kind) =>
    NAMES(n).flatMap((name) => (kind === "video" ? VIDEO_EXT : IMAGE_EXT).map((ext) => ({ url: `${SETTINGS.folder}/${name}.${ext}`, kind }))),
  );
  const hits = await Promise.all(candidates.map((c) => probe(c.url, c.kind)));
  const i = hits.findIndex(Boolean);
  return i === -1 ? null : candidates[i];
}

async function build() {
  for (let i = 0; i < SETTINGS.slides; i++) {
    const s = document.createElement("div");
    s.className = "slide";
    s.setAttribute("role", "group");
    s.setAttribute("aria-label", `Slide ${i + 1} of ${SETTINGS.slides}`);
    track.appendChild(s);
    slides.push(s);
    dots.appendChild(document.createElement("i"));
  }
  const found = await Promise.all(slides.map((_, i) => findFootage(i + 1)));
  found.forEach((f, i) => {
    const s = slides[i];
    if (!f) {
      s.innerHTML = `<div class="missing"><div><b>Slide ${i + 1}</b>Add ${SETTINGS.folder}/slide_${i + 1}.jpg (or .png, .mp4 …)</div></div>`;
      return;
    }
    if (f.kind === "video") {
      const v = document.createElement("video");
      Object.assign(v, { src: f.url, muted: true, loop: true, playsInline: true, preload: "auto" });
      v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
      s.appendChild(v);
    } else {
      const img = document.createElement("img");
      img.src = f.url; img.alt = `Slide ${i + 1}`; img.draggable = false;
      s.appendChild(img);
    }
  });
  update();
}

function video(i = current) { return slides[i]?.querySelector("video") || null; }

function update() {
  count.textContent = `${current + 1}/${SETTINGS.slides}`;
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i === current));
  $("prev").hidden = current === 0;
  $("next").hidden = current === SETTINGS.slides - 1;
  slides.forEach((_, i) => {
    const v = video(i);
    if (!v) return;
    if (i === current) { v.muted = muted; v.play().catch(() => {}); }
    else { v.pause(); v.currentTime = 0; }
  });
  const v = video();
  $("sound").hidden = !v;
  $("paused").hidden = true;
  renderSound();
}

function go(i) {
  i = Math.max(0, Math.min(SETTINGS.slides - 1, i));
  track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
}

// Keep "current" in sync with swipes / scrolling.
let raf;
track.addEventListener("scroll", () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== current) { current = i; update(); }
  });
}, { passive: true });

$("prev").onclick = () => go(current - 1);
$("next").onclick = () => go(current + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(current + 1);
  if (e.key === "ArrowLeft") go(current - 1);
});

// Tap a video to pause / play; double-tap anywhere to like (like Instagram).
let lastTap = 0, tapTimer;
track.addEventListener("click", (e) => {
  const now = Date.now();
  if (now - lastTap < 280) { clearTimeout(tapTimer); lastTap = 0; setLiked(true, true); return; }
  lastTap = now;
  tapTimer = setTimeout(() => {
    const v = video();
    if (!v) return;
    if (v.paused) { v.play().catch(() => {}); $("paused").hidden = true; }
    else { v.pause(); $("paused").hidden = false; }
  }, 280);
});

$("sound").onclick = () => { muted = !muted; const v = video(); if (v) { v.muted = muted; v.play().catch(() => {}); } renderSound(); };
function renderSound() {
  $("sound").setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off");
  $("sound").innerHTML = muted
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}

$("like").onclick = () => setLiked(!liked, false);
function setLiked(on, pop) {
  liked = on;
  const b = $("like");
  b.classList.toggle("liked", liked);
  b.setAttribute("aria-pressed", String(liked));
  b.querySelector("svg").setAttribute("fill", liked ? "currentColor" : "none");
  if (pop) { const h = $("heartPop"); h.classList.remove("on"); void h.offsetWidth; h.classList.add("on"); }
  renderLikes();
}
function renderLikes() {
  const n = SETTINGS.likes + (liked ? 1 : 0);
  $("likes").textContent = `${n.toLocaleString()} likes`;
}
$("save").onclick = function () {
  const on = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", String(on));
  this.querySelector("svg").setAttribute("fill", on ? "currentColor" : "none");
};

window.addEventListener("resize", () => track.scrollTo({ left: current * track.clientWidth }));
build();
</script>
</body>
</html>
