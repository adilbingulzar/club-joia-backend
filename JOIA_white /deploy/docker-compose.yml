# Everything in one go on a server with Docker: PostgreSQL + the app + Caddy (automatic HTTPS).
#   1. Edit Caddyfile (your domain) and .env (secrets, NEXT_PUBLIC_APP_URL, POSTGRES_PASSWORD).
#   2. docker compose up -d --build
# The database, uploads and certificates are kept in named volumes across restarts and upgrades.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: joia
      POSTGRES_DB: joia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joia -d joia"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://joia:${POSTGRES_PASSWORD}@db:5432/joia
      STORAGE_LOCAL_DIR: /app/data/uploads
      BIND_ADDRESS: 0.0.0.0
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
